# Workflow de pruebas automatizadas del Sistema de Inventario (Java + JUnit 4)
name: Pruebas - Sistema de Inventario

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Ejecutar pruebas de Producto
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el codigo del repositorio
      - name: Descargar el codigo
        uses: actions/checkout@v7

      # 2. Instalar el JDK 21 (javac y java)
      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 3. Descargar la herramienta de pruebas (JUnit 4 y su dependencia Hamcrest)
      - name: Descargar JUnit 4.13.2
        run: |
          mkdir -p lib
          curl -sSfL -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSfL -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      # 4. Compilar el codigo del producto y las pruebas
      - name: Compilar codigo y pruebas
        run: javac -encoding UTF-8 -cp lib/junit-4.13.2.jar -d out src/*.java tests/*.java

      # 5. Ejecutar las pruebas; si alguna falla, el paso termina con codigo 1
      - name: Ejecutar pruebas CP01 - CP07
        run: java -cp "out:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" EjecutarPruebas
